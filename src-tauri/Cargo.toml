[package]
name = "avel"
version = "1.2.4"
description = "Avel - Unified Windows Utility"
authors = ["Avel Team"]
edition = "2021"
license = "MIT"
repository = "https://github.com/gajsin/avel"
default-run = "avel"

[lib]
name = "avel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["tray-icon", "image-png", "image-ico", "protocol-asset"] }
tauri-plugin-single-instance = "2.2"
tauri-plugin-autostart = "2.2"
tauri-plugin-dialog = "2.2"
tauri-plugin-global-shortcut = "2.2"
tauri-plugin-log = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
dirs = "6.0"
winreg = "0.52"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3.10"
